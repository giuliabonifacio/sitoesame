<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIULIA. — I miei viaggi</title>
  <meta name="description" content="Un diario per immagini: viaggi, dettagli quotidiani e ricordi raccolti lungo la strada." />

  <!-- Font ispirati al sito di riferimento: un serif bold per il nome
       del sito, un monospace per titoli/testo/menu -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=IBM+Plex+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Palette e font definiti in un unico punto (ripetuti come CSS custom
    // properties in css/style.css per il resto del codice non-Tailwind).
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "#2E2B28", // testo principale, quasi nero
            muted: "#6B6B6B", // grigio scuro (menu, testo secondario)
            accent: "#7FB4D6", // azzurro (hover, elementi attivi)
            paper: "#F7F3EC", // sfondo pagina, beige chiaro
            frame: "#EAE3D4", // sfondo cornice galleria, poco più scuro
          },
          fontFamily: {
            serif: ['"Fraunces"', "serif"],
            mono: ['"IBM Plex Mono"', "monospace"],
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-paper text-ink font-mono font-light min-h-screen flex flex-col md:pl-64">

  <!-- ============ SIDEBAR (desktop) / TOP BAR (mobile) ============ -->
  <header id="navbar" class="fixed top-0 left-0 right-0 md:right-auto md:bottom-0 md:w-64 z-40 navbar-blur md:border-r md:border-ink/10 flex flex-col">
    <div class="flex items-center justify-between px-5 py-4 md:flex-col md:items-start md:px-8 md:py-10 md:gap-10">
      <a href="index.html" class="site-name-link font-serif text-2xl md:text-3xl font-black tracking-tight"></a>

      <!-- Sidebar: elenco luoghi (solo desktop) -->
      <ul id="nav-links" class="hidden md:flex md:flex-col md:gap-4 text-sm uppercase tracking-widest"></ul>

      <!-- Hamburger (solo mobile) -->
      <button id="menu-toggle" aria-label="Apri menu" aria-expanded="false" class="md:hidden flex flex-col justify-center items-center w-9 h-9 gap-1.5">
        <span class="block w-6 h-0.5 bg-ink"></span>
        <span class="block w-6 h-0.5 bg-ink"></span>
        <span class="block w-6 h-0.5 bg-ink"></span>
      </button>
    </div>
  </header>

  <!-- Link "Gallery" fisso in alto a destra (solo desktop) -->
  <a href="index.html" id="gallery-link" class="hidden md:block fixed top-10 right-8 z-40 text-xs uppercase tracking-widest nav-place">Gallery</a>

  <!-- Pannello menu mobile (animato via GSAP) -->
  <div id="mobile-panel" class="fixed top-0 right-0 h-full w-3/4 max-w-xs bg-ink z-50 flex flex-col px-8 py-8">
    <button id="menu-close" aria-label="Chiudi menu" class="self-end text-paper text-3xl leading-none mb-8">&times;</button>
    <span class="site-name-link font-serif text-2xl font-black text-paper mb-8"></span>
    <ul id="mobile-nav-links" class="flex flex-col gap-6 text-paper text-lg uppercase tracking-widest"></ul>
  </div>
  <div id="mobile-overlay" class="fixed inset-0 bg-ink/40 z-40 hidden"></div>

  <!-- ============ HOME: GALLERIA CASUALE ============ -->
  <main class="flex-1 pt-28 md:pt-20 pb-16 px-4 md:px-12 max-w-6xl w-full">
    <div class="gallery-intro max-w-2xl mb-10 md:mb-16">
      <h1 class="font-bold text-2xl md:text-4xl mb-4">Explore. Breathe. Remember.</h1>
      <p class="text-sm md:text-base font-light leading-relaxed text-muted">
        Il mio diario per immagini: un archivio personale di viaggi, dettagli quotidiani e ricordi preziosi collezionati lungo la strada.
      </p>
    </div>

    <div id="gallery-frame" class="gallery-frame">
      <div id="gallery-grid" class="gallery-grid"></div>
    </div>
  </main>

  <footer class="bg-ink text-paper text-center py-6 px-4 md:ml-0">
    <p class="text-base md:text-lg">© <span id="year"></span> <span class="site-name-link font-serif"></span> — tutti i viaggi, tutte le foto.</p>
  </footer>

  <!-- ============ SCRIPTS ============ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
